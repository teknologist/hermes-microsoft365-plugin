[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hermes-microsoft365-plugin"
version = "0.1.0a4"
description = "Pre-release native Hermes plugin for bounded Microsoft 365 Graph operations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fabio Motta"}]
dependencies = [
  "msgraph-sdk==1.64.0",
  "azure-identity==1.26.0",
  "microsoft-kiota-abstractions==1.14.2",
  "microsoft-kiota-http==1.14.2",
  "microsoft-kiota-serialization-json==1.14.2",
]

[project.optional-dependencies]
test = [
  "fastapi==0.162.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "detect-secrets==1.5.0",
  "pip-audit==2.10.1",
]

[project.entry-points."hermes_agent.plugins"]
microsoft365 = "microsoft365:register"

[tool.hatch.build.targets.wheel]
packages = ["microsoft365"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:.*deprecated.*:DeprecationWarning:msgraph\\.generated.*",
  "ignore:GetQueryParameters is deprecated.*:DeprecationWarning:kiota_abstractions\\.default_query_parameters",
]
